<div class="page-heading">
    <div>
        <h2>Nueva venta</h2>
        <p class="muted">Selecciona un cliente y agrega los productos</p>
    </div>
</div>
<form id="sale-form">
    <div class="sale-layout">
        <div>
            <div class="card grid">
                <div class="field">
                    <label for="sale-customer-search">Cliente</label>
                    <div class="autocomplete" data-autocomplete="customer">
                        <input id="sale-customer-search" type="search" placeholder="Escribe el nombre del cliente..." autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="sale-customer-options">
                        <div id="sale-customer-options" class="autocomplete-options" role="listbox" hidden></div>
                    </div>
                    <input id="sale-customer" type="hidden" value="">
                </div>
                <div class="field">
                    <label for="sale-product-search">Producto</label>
                    <div class="actions autocomplete-product-row">
                        <div class="autocomplete" data-autocomplete="product">
                            <input id="sale-product-search" type="search" placeholder="Escribe el nombre del producto..." autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="sale-product-options">
                            <div id="sale-product-options" class="autocomplete-options" role="listbox" hidden></div>
                        </div>
                        <button type="button" id="add-line" class="btn btn-light">Agregar producto</button>
                    </div>
                    <input id="sale-product" type="hidden" value="">
                </div>
            </div>
            <div class="card">
                <h3>Productos de la venta</h3>
                <div id="sale-lines">
                    <p class="empty">Agrega productos a la venta</p>
                </div>
            </div>
        </div>
        <aside class="card summary">
            <h3>Resumen</h3>
            <div class="muted">Total de la venta</div>
            <p class="total" id="sale-total">$0.00</p>
            <div class="field"><label>Tipo de pago (automático)</label><select id="payment-type" disabled>
                    <option value="paid">Pago completo</option>
                    <option value="partial">Pago parcial</option>
                    <option value="credit">Fiado</option>
                </select></div>
            <div class="field" style="margin-top:14px"><label>Efectivo recibido</label><input id="paid-amount"
                    type="number" min="0" step=".01" value="0"><small class="muted">Se considera también el saldo a
                    favor del cliente y primero se cubren sus deudas anteriores.</small></div>
            <p id="sale-payment-preview" class="muted" aria-live="polite">Agrega productos para calcular el pago.</p>
            <button type="submit" class="btn btn-primary" style="width:100%;margin-top:18px">Registrar venta</button>
        </aside>
    </div>
</form>
