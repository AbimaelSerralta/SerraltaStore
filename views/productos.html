<section id="product-list-screen">
    <div class="page-heading">
        <div>
            <h2>Productos</h2>
            <p class="muted">Catálogo de productos</p>
        </div><button class="btn btn-primary" id="new-product">＋ Nuevo producto</button>
    </div>
    <div class="card table-wrap">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Compra</th>
                    <th>Venta</th>
                    <th>Stock</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="product-list"></tbody>
        </table>
    </div>
</section>
<section id="product-form-screen" hidden>
    <div class="page-heading">
        <h2>Producto</h2><button class="btn btn-light" id="product-back">← Regresar</button>
    </div>
    <div class="card">
        <form id="product-form" class="form-grid"><input type="hidden" name="id">
            <div class="field"><label>Nombre</label><input name="name" required></div>
            <div class="field"><label>Precio de compra</label><input name="purchasePrice" type="number" min="0"
                    step=".01" required></div>
            <div class="field"><label>Precio de venta</label><input name="salePrice" type="number" min="0" step=".01"
                    required></div>
            <div class="field"><label>Existencia inicial</label><input name="stock" type="number" min="0" step="1"
                    required></div>
            <div class="field"><label>Stock mínimo</label><input name="minimumStock" type="number" min="0" step="1"
                    value="0"></div>
            <div class="field" style="align-self:end"><button class="btn btn-primary">Guardar producto</button></div>
        </form>
    </div>
</section>
