<section class="home-welcome">
  <div>
    <p class="home-kicker">PANEL DE CONTROL</p>
    <h2>¡Hola! Bienvenido a SerraltaStore</h2>
    <p class="muted">¿Qué vamos a vender hoy?</p>
  </div>
  <button class="btn btn-primary" data-view="ventas">＋ Nueva venta</button>
</section>
<section class="home-section">
  <div class="section-heading">
    <div>
      <h2>Resumen de hoy</h2>
      <p class="muted">Un vistazo rápido a tu tienda</p>
    </div>
  </div>
  <div class="home-stats">
    <article class="card home-stat"><span class="stat-label">Ventas de hoy</span><strong class="stat-value"
        id="home-today-sales">$0.00</strong><span class="stat-hint" id="home-sales-count">0 ventas</span></article>
    <article class="card home-stat"><span class="stat-label">Productos</span><strong class="stat-value"
        id="home-products">0</strong><span class="stat-hint">Registrados</span></article>
    <article class="card home-stat"><span class="stat-label">Clientes</span><strong class="stat-value"
        id="home-customers">0</strong><span class="stat-hint">Registrados</span></article>
    <article class="card home-stat"><span class="stat-label">Por cobrar</span><strong class="stat-value"
        id="home-receivable">$0.00</strong><span class="stat-hint">Saldo pendiente</span></article>
    <article class="card home-stat"><span class="stat-label">Saldo a favor</span><strong class="stat-value"
        id="home-credit">$0.00</strong><span class="stat-hint">De clientes</span></article>
  </div>
</section>
